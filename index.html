<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I can’t remember both my brothers birthday’s</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 1.5rem;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #111;
    color: #f5f5f5;
    text-align: center;
  }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0; max-width: 20ch; line-height: 1.25; }
  .buttons { display: flex; flex-direction: column; gap: 1rem; width: 100%; max-width: 320px; }
  a.btn {
    display: block;
    padding: 1.25rem 1rem;
    font-size: 1.4rem;
    font-weight: 600;
    color: #111;
    background: #f5f5f5;
    border-radius: 14px;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  a.btn:active { transform: scale(0.97); background: #ddd; }
</style>
</head>
<body>
  <h1>I can’t remember both my brothers birthday’s</h1>
  <div class="buttons">
    <a class="btn" href="https://open.spotify.com/artist/0SwOn2qlqsCJbMCLzEYq4i">Mirko</a>
    <a class="btn" href="https://open.spotify.com/artist/0SwOn2qlqsCJbMCLzEYq4i">Boris</a>
  </div>
</body>
</html>
