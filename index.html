<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I can’t remember both my brothers birthday’s</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 1.5rem;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #111;
    color: #f5f5f5;
    text-align: center;
  }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0; max-width: 20ch; line-height: 1.25; }
  .buttons { display: flex; flex-direction: column; gap: 1rem; width: 100%; max-width: 320px; }
  a.btn {
    display: block;
    padding: 1.25rem 1rem;
    font-size: 1.4rem;
    font-weight: 600;
    color: #111;
    background: #f5f5f5;
    border-radius: 14px;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  a.btn:active { transform: scale(0.97); background: #ddd; }

  body { position: relative; overflow: hidden; background: #ff2d95; }
  #collage { position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background:
      radial-gradient(circle, #000 18%, transparent 20%) 0 0 / 14px 14px,
      linear-gradient(135deg, #ffe600 0 33%, #00e5ff 33% 66%, #ff2d95 66%);
  }
  #collage .p { position: absolute; }
  #collage .t { position: absolute; font-weight: 900; line-height: 1; padding: .1em .25em; box-shadow: 2px 3px 0 rgba(0,0,0,.5); }
  #collage .tape { position: absolute; width: 90px; height: 26px; background: rgba(255,255,220,.65); border: 1px dashed rgba(0,0,0,.3); }
  h1, .buttons { position: relative; z-index: 1; }
  h1 { background: #fff; color: #000; border: 4px solid #000; padding: .6rem .9rem; transform: rotate(-2deg); box-shadow: 6px 6px 0 #000; }
  a.btn { border: 4px solid #000; box-shadow: 5px 5px 0 #000; }
  .buttons a.btn:nth-child(1) { transform: rotate(1.5deg); }
  .buttons a.btn:nth-child(2) { transform: rotate(-1.5deg); }
</style>
</head>
<body>
  <div id="collage"></div>
  <h1>I can’t remember both my brothers birthday’s</h1>
  <div class="buttons">
    <a class="btn" href="https://open.spotify.com/artist/0SwOn2qlqsCJbMCLzEYq4i">Mirko</a>
    <a class="btn" href="https://open.spotify.com/artist/0SwOn2qlqsCJbMCLzEYq4i">Boris</a>
  </div>

<script>
(function () {
  var seed = 7;
  function r() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  function pick(a) { return a[Math.floor(r() * a.length)]; }
  var colors = ['#ff2d95','#ffe600','#00e5ff','#39ff14','#ff6a00','#7a00ff','#e60000','#ffffff','#111111','#0057ff'];
  var fonts = ['Impact, sans-serif','"Courier New", monospace','Georgia, serif','"Comic Sans MS", cursive','Arial Black, sans-serif','"Times New Roman", serif'];
  var host = document.getElementById('collage');
  var W = window.innerWidth, H = window.innerHeight;

  function poly() {
    var n = 6 + Math.floor(r() * 5), pts = [];
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2, rad = 38 + r() * 12;
      pts.push((50 + Math.cos(a) * rad).toFixed(1) + '% ' + (50 + Math.sin(a) * rad).toFixed(1) + '%');
    }
    return 'polygon(' + pts.join(',') + ')';
  }
  for (var i = 0; i < 45; i++) {
    var d = document.createElement('div'); d.className = 'p';
    var w = 80 + r() * 220, h = 80 + r() * 220;
    d.style.cssText = 'left:' + (r() * W - 60) + 'px;top:' + (r() * H - 60) + 'px;width:' + w + 'px;height:' + h + 'px;' +
      'background:' + pick(colors) + ';transform:rotate(' + (r() * 90 - 45) + 'deg);clip-path:' + poly() + ';opacity:.9;';
    if (r() < .3) d.style.backgroundImage = 'repeating-linear-gradient(45deg,#000 0 6px,transparent 6px 14px)';
    host.appendChild(d);
  }
  function ransom(text, x, y, size, rot) {
    var row = document.createElement('div');
    row.style.cssText = 'position:absolute;left:' + x + 'px;top:' + y + 'px;transform:rotate(' + rot + 'deg);white-space:nowrap;';
    text.split('').forEach(function (ch) {
      var t = document.createElement('span'); t.className = 't'; t.textContent = ch;
      t.style.cssText = 'position:relative;display:inline-block;font-size:' + (size * (.7 + r() * .7)) + 'px;font-family:' + pick(fonts) +
        ';background:' + pick(colors) + ';color:' + pick(colors) + ';transform:rotate(' + (r() * 20 - 10) + 'deg) translateY(' + (r() * 10 - 5) + 'px);margin:0 1px;padding:.05em .2em;box-shadow:2px 3px 0 rgba(0,0,0,.5);';
      row.appendChild(t);
    });
    host.appendChild(row);
  }
  var names = ['ANTHONY','KIEDIS','ANTHONY KIEDIS','ANTHONY'];
  for (var j = 0; j < 9; j++) {
    ransom(pick(names), r() * W * .6 - 40, r() * H, 28 + r() * 40, r() * 60 - 30);
  }
  for (var k = 0; k < 14; k++) {
    var tp = document.createElement('div'); tp.className = 'tape';
    tp.style.left = (r() * W) + 'px'; tp.style.top = (r() * H) + 'px';
    tp.style.transform = 'rotate(' + (r() * 120 - 60) + 'deg)';
    host.appendChild(tp);
  }
})();
</script>
</body>
</html>
